plugins {
    id 'com.android.application'
}

// Release signing dibaca dari android/key.properties (TIDAK di-commit).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('key.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.chessqq.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.chessqq.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProps['storeFile'] ?: 'keystore/release.jks')
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias'] ?: 'chessqq'
            keyPassword keystoreProps['keyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
